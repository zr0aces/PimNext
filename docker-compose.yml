services:
  notanext:
    # Pulls the pre-built image; `docker compose up -d --build` builds this tag locally.
    image: ghcr.io/zr0aces/notanext:1.2.2
    build:
      context: .
      args:
        VERSION: "1.2.2"
    container_name: notanext
    restart: always
    # All configuration comes from .env so that editing it actually takes
    # effect. A hardcoded `environment:` block would silently override env_file.
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    volumes:
      # Persist the preferences file (data/preferences.json) across container
      # recreations.  The host directory is created automatically by Docker if
      # it does not yet exist.
      - ./data:/app/data
    # Prevent unbounded log growth on long-running hosts (e.g. Raspberry Pi SD card)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
